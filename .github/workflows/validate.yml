name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua parser
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Parse Lua
        run: find colors plugins -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Validate Lite XL plugin ordering
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Parse shell installers
        run: bash -n scripts/install.sh scripts/uninstall.sh

      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ -ErrorAction Continue }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Reject private or binary assets
        run: |
          if find . -type f \( -iname '*.dll' -o -iname '*.exe' -o -iname '*.so' -o -iname '*.dylib' -o -iname '*.lib' -o -iname '*.ttf' -o -iname '*.otf' -o -iname 'session.lua' -o -iname 'font_cache.lua' -o -iname 'error.txt' \) -print -quit | grep -q .; then
            echo 'Forbidden private or binary asset found.' >&2
            exit 1
          fi

      - name: Reject branded code assets and system font paths
        run: |
          if grep -RniE 'microsoft_visual_studio_code|visual studio code|copilot|C:\\Windows\\Fonts' colors plugins; then
            echo 'Forbidden branded or platform-specific code reference found.' >&2
            exit 1
          fi

  windows-network-fallback:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Full dependency install with simulated native HTTPS failure
        shell: ${{ matrix.shell }}
        run: ./scripts/test-windows-network.ps1

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install and uninstall on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          userdir="$RUNNER_TEMP/lite-vs-user"
          LITE_USERDIR="$userdir" LITE_VS_SKIP_DEPENDENCIES=1 ./scripts/install.sh
          test -s "$userdir/fonts/lite-vs/Inter.ttf"
          test -s "$userdir/plugins/lite_vs_layout.lua"
          test -s "$userdir/plugins/lite_vs_settings.lua"
          LITE_USERDIR="$userdir" ./scripts/uninstall.sh
          test ! -e "$userdir/fonts/lite-vs/Inter.ttf"
          test ! -e "$userdir/plugins/lite_vs_layout.lua"
          test ! -e "$userdir/plugins/lite_vs_settings.lua"

      - name: Install and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $userdir = Join-Path $env:RUNNER_TEMP 'lite-vs-user'
          ./scripts/install.ps1 -UserDir $userdir -SkipDependencies
          if (-not (Test-Path -LiteralPath (Join-Path $userdir 'fonts\lite-vs\Inter.ttf'))) { throw 'Inter font was not installed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $userdir 'plugins\lite_vs_layout.lua'))) { throw 'Layout plugin was not installed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $userdir 'plugins\lite_vs_settings.lua'))) { throw 'Settings plugin was not installed.' }
          ./scripts/uninstall.ps1 -UserDir $userdir
          if (Test-Path -LiteralPath (Join-Path $userdir 'fonts\lite-vs\Inter.ttf')) { throw 'Inter font was not removed.' }
          if (Test-Path -LiteralPath (Join-Path $userdir 'plugins\lite_vs_layout.lua')) { throw 'Layout plugin was not removed.' }
          if (Test-Path -LiteralPath (Join-Path $userdir 'plugins\lite_vs_settings.lua')) { throw 'Settings plugin was not removed.' }
